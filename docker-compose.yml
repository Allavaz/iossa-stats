services:
  app:
    image: ghcr.io/allavaz/iossa-stats:latest
    restart: unless-stopped
    env_file: .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/www/cdn:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /var/www/cdn:/srv/uploads:ro
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
